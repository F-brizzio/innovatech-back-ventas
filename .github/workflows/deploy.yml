name: CI/CD Back-Ventas

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir imagen Docker
        run: docker build -t lucianodelgado/innovatech-back-ventas:latest ./Springboot-API-REST

      - name: Publicar imagen en Docker Hub
        run: docker push lucianodelgado/innovatech-back-ventas:latest

      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull lucianodelgado/innovatech-back-ventas:latest
            docker stop innovatech-back-ventas || true
            docker rm innovatech-back-ventas || true
            docker run -d \
              --name innovatech-back-ventas \
              -p 8082:8081 \
              -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
              -e DB_PORT=3306 \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              lucianodelgado/innovatech-back-ventas:latest